<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Desmond — Reels</title>
<style>
/* ─── SYSTEM FONT STACK (Apple DNA) ─── */
:root {
  --sf: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;

  /* Apple palette */
  --bg:        #F5F5F7;
  --surface:   #FFFFFF;
  --surface2:  #F5F5F7;
  --line:      #D2D2D7;
  --line-soft: #E8E8ED;
  --ink:       #1D1D1F;
  --ink2:      #6E6E73;
  --ink3:      #AEAEB2;
  --blue:      #0066CC;
  --blue-soft: #EBF3FF;
  --red:       #FF3B30;
  --red-soft:  #FFF0EF;
  --green:     #34C759;
  --green-soft:#F0FBF3;
  --amber:     #FF9500;
  --amber-soft:#FFF6E8;

  /* Status colors */
  --pend-bg:  #FFF6E8; --pend-tx: #C47800;
  --edit-bg:  #EBF3FF; --edit-tx: #0055AA;
  --done-bg:  #F0FBF3; --done-tx: #1A7A35;

  /* Urgency */
  --urg-bg:   #FFF0EF; --urg-tx: #CC2200;
  --eve-bg:   #F0FBF3; --eve-tx: #1A7A35;

  --radius:    12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
}

.dark {
  --bg:        #000000;
  --surface:   #1C1C1E;
  --surface2:  #2C2C2E;
  --line:      #38383A;
  --line-soft: #2C2C2E;
  --ink:       #F5F5F7;
  --ink2:      #8E8E93;
  --ink3:      #48484A;
  --blue:      #0A84FF;
  --blue-soft: #001D3D;
  --red:       #FF453A;
  --red-soft:  #3D0F0D;
  --green:     #30D158;
  --green-soft:#0D2E17;
  --amber:     #FF9F0A;
  --amber-soft:#2E1D00;
  --pend-bg:  #2E1D00; --pend-tx: #FF9F0A;
  --edit-bg:  #001D3D; --edit-tx: #0A84FF;
  --done-bg:  #0D2E17; --done-tx: #30D158;
  --urg-bg:   #3D0F0D; --urg-tx:  #FF6B63;
  --eve-bg:   #0D2E17; --eve-tx:  #30D158;
}

/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font-family: inherit; }
html, body { height: 100%; }

body {
  font-family: var(--sf);
  font-size: 15px;
  line-height: 1.47;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

/* ─── APP SHELL ─── */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 800px;
  margin: 0 auto;
  background: var(--bg);
}

/* ─── TOP BAR ─── */
.topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 12px 20px 0;
  background: var(--bg);
  gap: 10px;
}
.topbar-brand {
  flex: 1;
  min-width: 0;
}
.topbar-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--ink3);
  line-height: 1;
  margin-bottom: 2px;
}
.topbar-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.5px;
  color: var(--ink);
  line-height: 1;
}
.topbar-actions { display: flex; gap: 8px; align-items: center; }

/* Sync pill */
.sync-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  cursor: pointer;
  letter-spacing: .1px;
  transition: background .15s;
  white-space: nowrap;
}
.sync-pill:active { background: var(--surface2); }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); flex-shrink: 0; transition: background .3s; }
.sdot.ok  { background: var(--green); }
.sdot.err { background: var(--red); }
.sdot.spin { background: var(--blue); animation: blink .6s infinite alternate; }
@keyframes blink { from { opacity: .3; } to { opacity: 1; } }

/* Icon buttons */
.ico {
  width: 34px; height: 34px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--ink2);
  flex-shrink: 0;
  transition: background .15s;
}
.ico:active { background: var(--surface2); }
.ico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Primary add button */
.add-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--blue);
  border: none;
  border-radius: 20px;
  padding: 7px 16px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -.1px;
  transition: opacity .15s;
  white-space: nowrap;
}
.add-btn:active { opacity: .8; }
.add-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; }

/* ─── SEGMENT CONTROL (Apple-style tabs) ─── */
.seg-wrap {
  flex-shrink: 0;
  padding: 12px 20px 0;
}
.seg {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 3px;
  gap: 2px;
}
.seg-btn {
  flex: 1;
  padding: 6px 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink2);
  background: none;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .15s, color .15s;
  letter-spacing: -.1px;
  text-align: center;
}
.seg-btn.on {
  background: var(--surface2);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04);
}

/* ─── STAT ROW ─── */
.stats {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 12px 20px 0;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px 16px;
  border: 1px solid var(--line-soft);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  -webkit-user-select: none; user-select: none;
}
.stat-card:active { background: var(--surface2); }
.stat-card.active-filter { border-color: var(--blue); background: var(--blue-soft); }
.stat-card.active-filter .stat-l { color: var(--blue); }

/* Editor toggle */
.editor-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 2px;
}
.editor-opt {
  flex: 1;
  padding: 8px 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink2);
  background: none;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, color .15s;
  text-align: center;
}
.editor-opt.on {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

/* Edit mode in detail */
.edit-field {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 15px;
  color: var(--ink);
  font-family: var(--sf);
  margin-bottom: 4px;
}
.edit-field:focus { outline: none; }
.edit-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--ink2);
  font-family: var(--sf);
  line-height: 1.6;
  height: 110px;
  resize: none;
  margin-bottom: 4px;
}
.edit-textarea:focus { outline: none; }
.edit-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.btn-save-edit {
  background: var(--blue);
  border: none;
  border-radius: var(--radius-xs);
  padding: 7px 16px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-save-edit:active { opacity: .8; }
.btn-cancel-edit {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: var(--radius-xs);
  padding: 7px 14px;
  color: var(--ink2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.edit-btn {
  background: none;
  border: none;
  color: var(--blue);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  font-family: var(--sf);
}
.stat-n {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
  color: var(--ink);
}
.stat-l {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  margin-top: 3px;
  letter-spacing: .1px;
}

/* ─── SCROLL AREA ─── */
.scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 20px 32px;
}
.scroll::-webkit-scrollbar { width: 0; }

/* ─── SECTION HEADER ─── */
.section-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  margin-top: 8px;
}
.section-hdr:first-child { margin-top: 0; }
.section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink3);
}
.section-action {
  font-size: 13px;
  font-weight: 500;
  color: var(--blue);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  letter-spacing: -.1px;
}
.section-action:active { opacity: .6; }

/* ─── VIDEO LIST ─── */
.vid-list {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line-soft);
  overflow: hidden;
  margin-bottom: 16px;
}
.vid-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background .12s;
  -webkit-user-select: none; user-select: none;
}
.vid-item:last-child { border-bottom: none; }
.vid-item:active { background: var(--surface2); }
.vid-left { flex: 1; min-width: 0; }
.vid-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.vid-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.vid-date { font-size: 12px; color: var(--ink3); }
.vid-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.chevron {
  color: var(--ink3);
  margin-left: 4px;
  flex-shrink: 0;
}
.chevron svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

/* ─── BADGES ─── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1px;
  white-space: nowrap;
}
.b-pend { background: var(--pend-bg); color: var(--pend-tx); }
.b-edit { background: var(--edit-bg); color: var(--edit-tx); }
.b-done { background: var(--done-bg); color: var(--done-tx); }
.b-urg  { background: var(--urg-bg);  color: var(--urg-tx);  }
.b-eve  { background: var(--eve-bg);  color: var(--eve-tx);  }

/* ─── EMPTY STATE ─── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  text-align: center;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line-soft);
  margin-bottom: 16px;
}
.empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
  opacity: .5;
}
.empty-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
  letter-spacing: -.3px;
}
.empty-sub {
  font-size: 14px;
  color: var(--ink2);
  max-width: 200px;
  line-height: 1.4;
}

/* ─── CALENDAR VIEW ─── */
.cal-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.cal-lbl {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.3px;
  color: var(--ink);
}
.cal-day {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
}
.cal-day-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface2);
  border-bottom: 1px solid var(--line-soft);
}
.cal-day-name {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
  text-transform: uppercase;
  color: var(--ink2);
}
.cal-day-num {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink3);
}
.cal-day-hdr.today .cal-day-name,
.cal-day-hdr.today .cal-day-num {
  color: var(--blue);
}
.cal-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-top: 1px solid var(--line-soft);
  font-size: 13px;
  color: var(--ink);
}
.cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
.cal-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.cal-empty {
  padding: 12px 16px;
  font-size: 13px;
  color: var(--ink3);
  border-top: 1px solid var(--line-soft);
  font-style: italic;
}

/* ─── ARCHIVE VIEW ─── */
.arch-month-lbl {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink3);
  margin: 16px 0 8px;
}
.arch-month-lbl:first-child { margin-top: 0; }

/* ─── SHEETS VIEW ─── */
.info-card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
}
.info-card-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sheet-link {
  font-size: 14px;
  font-weight: 500;
  color: var(--blue);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 12px;
  text-decoration: none;
}
.sheet-link:active { opacity: .7; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.action-btn {
  background: var(--blue);
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -.1px;
  transition: opacity .15s;
}
.action-btn:active { opacity: .8; }
.action-btn.ghost {
  background: var(--surface2);
  color: var(--ink);
  border: 1px solid var(--line);
}
.etbl-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--line-soft); }
.etbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.etbl th { padding: 9px 12px; text-align: left; background: var(--surface2); color: var(--ink2); font-weight: 600; font-size: 11px; letter-spacing: .3px; text-transform: uppercase; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.etbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); color: var(--ink); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etbl tr:last-child td { border-bottom: none; }

/* Setup */
.setup-card {
  background: var(--amber-soft, #FFF6E8);
  border: 1px solid var(--amber);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.setup-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.setup-body { font-size: 13px; color: var(--ink2); line-height: 1.6; margin-bottom: 12px; }
.setup-steps {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  font-size: 12px;
  line-height: 1.9;
  color: var(--ink2);
  margin-bottom: 12px;
  display: none;
}
.setup-steps b { color: var(--ink); }
code { background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 11px; }
.setup-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--ink);
  font-family: monospace;
  margin-bottom: 10px;
}
.setup-input:focus { outline: none; border-color: var(--blue); }
.connected-card {
  background: var(--done-bg);
  border: 1px solid var(--green);
  border-radius: var(--radius);
  padding: 13px 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--done-tx);
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: rgba(29, 29, 31, 0.88);
  backdrop-filter: blur(20px) saturate(1.8);
  -webkit-backdrop-filter: blur(20px) saturate(1.8);
  color: #fff;
  border-radius: 20px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -.1px;
  pointer-events: none;
  white-space: nowrap;
  z-index: 600;
  opacity: 0;
  transition: opacity .2s, transform .2s;
}
.dark .toast { background: rgba(99, 99, 102, 0.7); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── MODAL SYSTEM ─── */
.modal {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  visibility: hidden;
  pointer-events: none;
}
.modal.open { visibility: visible; pointer-events: all; }
.modal-scrim {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.4);
  opacity: 0;
  transition: opacity .28s;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal.open .modal-scrim { opacity: 1; }
.modal-sheet {
  position: relative;
  width: 100%;
  max-width: 600px;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 0 20px 40px;
  max-height: 94vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  transition: transform .32s cubic-bezier(.32, 0, .15, 1);
  border-top: .5px solid var(--line-soft);
}
.modal.open .modal-sheet { transform: translateY(0); }
.modal-grip {
  width: 36px;
  height: 4px;
  background: var(--line);
  border-radius: 4px;
  margin: 10px auto 18px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.modal-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.4px;
  color: var(--ink);
}
.modal-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface2);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--ink2);
  font-size: 16px;
  flex-shrink: 0;
  transition: background .15s;
  line-height: 1;
}
.modal-close:active { background: var(--line); }

/* ─── FORM ─── */
.f-group { margin-bottom: 18px; }
.f-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 8px;
}
.f-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 15px;
  color: var(--ink);
  transition: border-color .15s, background .15s;
}
.f-input:focus { outline: none; border-color: var(--blue); background: var(--surface); }
.f-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
  height: 120px;
  resize: none;
  transition: border-color .15s, background .15s;
}
.f-textarea:focus { outline: none; border-color: var(--blue); background: var(--surface); }

/* Urgency picker */
.urg-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.urg-opt {
  border: 1.5px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
  cursor: pointer;
  background: var(--surface2);
  transition: all .15s;
  -webkit-user-select: none;
}
.urg-opt:active { transform: scale(.97); }
.urg-opt.sel-u { border-color: var(--red);   background: var(--urg-bg); }
.urg-opt.sel-e { border-color: var(--green);  background: var(--eve-bg); }
.urg-icon { font-size: 26px; display: block; margin-bottom: 6px; }
.urg-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.urg-desc { font-size: 11px; color: var(--ink3); margin-top: 2px; }
.urg-opt.sel-u .urg-name { color: var(--urg-tx); }
.urg-opt.sel-e .urg-name { color: var(--eve-tx); }

/* Form actions */
.form-actions {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 10px;
  margin-top: 6px;
}
.btn-ghost {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 13px;
  color: var(--ink2);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background .15s;
}
.btn-ghost:active { background: var(--line); }
.btn-primary {
  background: var(--blue);
  border: none;
  border-radius: var(--radius-sm);
  padding: 13px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.1px;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-primary:active, .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

/* ─── DETAIL MODAL ─── */
.det-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.det-date { font-size: 13px; color: var(--ink3); display: flex; align-items: center; gap: 5px; }
.det-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.5px;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.25;
}
.script-card {
  background: var(--surface2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.75;
  max-height: 160px;
  overflow-y: auto;
  white-space: pre-wrap;
  margin-bottom: 20px;
}
.det-section { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }
.status-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.s-btn {
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 7px 18px;
  background: var(--surface2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  transition: all .15s;
}
.s-btn:active { transform: scale(.96); }
.s-btn.sp { background: var(--pend-bg); border-color: var(--pend-tx); color: var(--pend-tx); }
.s-btn.se { background: var(--edit-bg); border-color: var(--edit-tx); color: var(--edit-tx); }
.s-btn.sd { background: var(--done-bg); border-color: var(--done-tx); color: var(--done-tx); }
.urg-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.u-btn {
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 7px 18px;
  background: var(--surface2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  transition: all .15s;
}
.u-btn:active { transform: scale(.96); }
.u-btn.su { background: var(--urg-bg); border-color: var(--urg-tx); color: var(--urg-tx); }
.u-btn.se2 { background: var(--eve-bg); border-color: var(--eve-tx); color: var(--eve-tx); }
.det-del {
  width: 100%;
  background: none;
  border: 1px solid rgba(255,59,48,.25);
  border-radius: var(--radius-sm);
  padding: 12px;
  color: var(--red);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background .15s;
  margin-top: 6px;
}
.det-del:active { background: var(--red-soft); }

@media (prefers-reduced-motion: reduce) {
  *, .modal-sheet, .toast { transition: none; animation: none; }
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-eyebrow">Production</div>
      <div class="topbar-name">Desmond's Reels</div>
    </div>
    <div class="topbar-actions">
      <button class="sync-pill" onclick="doRefresh()" id="sync-pill">
        <div class="sdot" id="sdot"></div>
        <span id="slbl">Offline</span>
      </button>
      <button class="ico" onclick="toggleDark()" id="dark-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="add-btn" onclick="openAdd()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New
      </button>
    </div>
  </div>

  <!-- SEGMENT CONTROL -->
  <div class="seg-wrap">
    <div class="seg">
      <button class="seg-btn on" onclick="goTab('board',this)">Board</button>
      <button class="seg-btn"    onclick="goTab('week',this)">Calendar</button>
      <button class="seg-btn"    onclick="goTab('sheets',this)">Sheets</button>
      <button class="seg-btn"    onclick="goTab('archive',this)">Archive</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card" id="sc-all" onclick="setFilter('all')">
      <div class="stat-n" id="stn">0</div>
      <div class="stat-l">All</div>
    </div>
    <div class="stat-card" id="sc-pending" onclick="setFilter('pending')">
      <div class="stat-n" style="color:var(--pend-tx)" id="stp">0</div>
      <div class="stat-l">Pending</div>
    </div>
    <div class="stat-card" id="sc-done" onclick="setFilter('done')">
      <div class="stat-n" style="color:var(--done-tx)" id="std">0</div>
      <div class="stat-l">Done</div>
    </div>
  </div>

  <!-- SCROLL -->
  <div class="scroll" id="scr">

    <!-- BOARD -->
    <div id="v-board">
      <div class="section-hdr">
        <span class="section-title" id="section-title-lbl">Active</span>
        <button class="section-action" onclick="doArchiveWeek()">Archive done</button>
      </div>
      <div id="vid-list"></div>
    </div>

    <!-- CALENDAR -->
    <div id="v-week" style="display:none">
      <div class="cal-nav">
        <button class="ico" onclick="prevWeek()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="cal-lbl" id="wlbl"></span>
        <button class="ico" onclick="nextWeek()">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div id="cal-days"></div>
    </div>

    <!-- SHEETS -->
    <div id="v-sheets" style="display:none">
      <div id="setup-zone"></div>
      <div class="info-card">
        <div class="info-card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          Google Sheet
        </div>
        <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/130m6Q7EgVXcsx_R9tZoXdd7l47nUQFFZbsP0qU_19FM/edit?usp=sharing" target="_blank">
          Open spreadsheet
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
        <div class="btn-row">
          <button class="action-btn" onclick="cpCSV()">Copy CSV</button>
          <button class="action-btn ghost" onclick="dlCSV()">Download</button>
        </div>
      </div>
      <div class="etbl-wrap" style="margin-top:12px">
        <table class="etbl">
          <thead><tr><th>Date</th><th>Title</th><th>Type</th><th>Status</th></tr></thead>
          <tbody id="etbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ARCHIVE -->
    <div id="v-archive" style="display:none">
      <div id="arch-content">
        <div class="empty">
          <div class="empty-icon">🗂️</div>
          <div class="empty-title">Nothing archived yet</div>
          <div class="empty-sub">Done videos are archived weekly from the Board tab</div>
        </div>
      </div>
    </div>

  </div><!-- /scroll -->
</div><!-- /app -->

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ═══ ADD MODAL ═══ -->
<div class="modal" id="add-modal">
  <div class="modal-scrim" onclick="closeAdd()"></div>
  <div class="modal-sheet">
    <div class="modal-grip"></div>
    <div class="modal-header">
      <span class="modal-title">New reel</span>
      <button class="modal-close" onclick="closeAdd()">&#215;</button>
    </div>

    <div class="f-group">
      <label class="f-label" for="f-title">Title</label>
      <input class="f-input" id="f-title" placeholder="e.g. Why most people fail at business" autocomplete="off" />
    </div>

    <div class="f-group">
      <label class="f-label" for="f-script">Script</label>
      <textarea class="f-textarea" id="f-script" placeholder="Paste the script from WhatsApp here…"></textarea>
    </div>

    <div class="f-group">
      <label class="f-label">Date</label>
      <input class="f-input" id="f-date" type="date" />
    </div>

    <div class="f-group">
      <label class="f-label">Editor</label>
      <div class="editor-toggle">
        <button class="editor-opt on" id="ed-steven"   onclick="pickEditor('Steven')">Steven</button>
        <button class="editor-opt"    id="ed-sherlynn" onclick="pickEditor('Sherlynn')">Sherlynn</button>
      </div>
    </div>

    <div class="f-group">
      <label class="f-label">Content type</label>
      <div class="urg-grid">
        <div class="urg-opt" id="opt-u" onclick="pickU('urgent')">
          <span class="urg-icon">🔥</span>
          <div class="urg-name">Urgent</div>
          <div class="urg-desc">Time-sensitive</div>
        </div>
        <div class="urg-opt" id="opt-e" onclick="pickU('evergreen')">
          <span class="urg-icon">🌿</span>
          <div class="urg-name">Evergreen</div>
          <div class="urg-desc">Always relevant</div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-ghost" onclick="closeAdd()">Cancel</button>
      <button class="btn-primary" id="btn-save" onclick="saveVideo()">Add reel</button>
    </div>
  </div>
</div>

<!-- ═══ DETAIL MODAL ═══ -->
<div class="modal" id="det-modal">
  <div class="modal-scrim" onclick="closeDet()"></div>
  <div class="modal-sheet">
    <div class="modal-grip"></div>
    <div class="modal-header">
      <span class="modal-title" id="det-modal-title">Reel</span>
      <button class="modal-close" onclick="closeDet()">&#215;</button>
    </div>
    <div class="det-title" id="det-title"></div>
    <div class="det-meta" id="det-meta"></div>
    <div class="det-section">Script</div>
    <div class="script-card" id="det-script"></div>
    <div class="det-section">Status</div>
    <div class="status-row" id="det-status"></div>
    <div class="det-section">Content type</div>
    <div class="urg-row" id="det-urg"></div>
    <button class="det-del" onclick="deleteVideo()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Remove reel
    </button>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────
let SCRIPT_URL = localStorage.getItem('reels_url') || '';
// ─────────────────────────────────────────────────────────────────────────

let dark    = false;
let urgency = null;
let editor  = 'Steven';   // default editor
let curId   = null;
let weekOff = 0;
let activeFilter = 'all'; // 'all' | 'pending' | 'editing' | 'done'
let videos   = JSON.parse(localStorage.getItem('reels_videos')   || '[]');
let archived = JSON.parse(localStorage.getItem('reels_archived') || '[]');

// ─── DARK MODE ────────────────────────────────────────────────────────────
function toggleDark() {
  dark = !dark;
  document.getElementById('app').className = dark ? 'dark' : '';
  document.getElementById('dark-btn').innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  localStorage.setItem('reels_dark', dark ? '1' : '');
}
if (localStorage.getItem('reels_dark') === '1') toggleDark();

// ─── TABS ─────────────────────────────────────────────────────────────────
function goTab(t, btn) {
  ['board','week','sheets','archive'].forEach(id =>
    document.getElementById('v-' + id).style.display = id === t ? '' : 'none'
  );
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('scr').scrollTop = 0;
  if (t === 'week')    renderWeek();
  if (t === 'sheets')  { renderExport(); renderSetup(); }
  if (t === 'archive') renderArchive();
}

// ─── SYNC ─────────────────────────────────────────────────────────────────
function setSyncStatus(s) {
  document.getElementById('sdot').className = 'sdot' + (s ? ' ' + s : '');
  document.getElementById('slbl').textContent =
    s === 'ok' ? 'Synced' : s === 'err' ? 'Error' : s === 'spin' ? 'Syncing…' : 'Offline';
}

async function apiPost(body) {
  if (!SCRIPT_URL) return null;
  setSyncStatus('spin');
  try {
    const r = await fetch(SCRIPT_URL, {
      method: 'POST', body: JSON.stringify(body),
      headers: { 'Content-Type': 'text/plain' }
    });
    const d = await r.json();
    setSyncStatus('ok'); return d;
  } catch { setSyncStatus('err'); return null; }
}

async function doRefresh() {
  if (!SCRIPT_URL) { showToast('Add your Script URL in Sheets first'); return; }
  showToast('Syncing…');
  setSyncStatus('spin');
  try {
    const [vr, ar] = await Promise.all([
      fetch(SCRIPT_URL + '?action=list',        { cache: 'no-store' }).then(r => r.json()),
      fetch(SCRIPT_URL + '?action=listArchive', { cache: 'no-store' }).then(r => r.json())
    ]);
    if (vr?.videos)   videos   = vr.videos.map(v   => ({ ...v,   id: String(v.id) }));
    if (ar?.archived) archived = ar.archived.map(v  => ({ ...v,   id: String(v.id) }));
    saveLocal(); renderAll(); setSyncStatus('ok');
    showToast('Synced ✓');
  } catch { setSyncStatus('err'); showToast('Sync failed — check connection'); }
}

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────
function saveLocal() {
  localStorage.setItem('reels_videos',   JSON.stringify(videos));
  localStorage.setItem('reels_archived', JSON.stringify(archived));
}

// ─── FILTER ───────────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = activeFilter === f && f !== 'all' ? 'all' : f;
  ['all','pending','done'].forEach(k => {
    const el = document.getElementById('sc-' + k);
    if (el) el.classList.toggle('active-filter', activeFilter === k && k !== 'all' || (activeFilter === 'all' && k === 'all' && false));
  });
  // highlight active card
  document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active-filter'));
  if (activeFilter !== 'all') document.getElementById('sc-' + activeFilter)?.classList.add('active-filter');
  renderBoard();
}

// ─── EDITOR ───────────────────────────────────────────────────────────────
function pickEditor(e) {
  editor = e;
  document.getElementById('ed-steven').classList.toggle('on', e === 'Steven');
  document.getElementById('ed-sherlynn').classList.toggle('on', e === 'Sherlynn');
}

// ─── ADD VIDEO ────────────────────────────────────────────────────────────
function openAdd() {
  urgency = null;
  editor  = 'Steven';
  ['f-title','f-script'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('opt-u').className = 'urg-opt';
  document.getElementById('opt-e').className = 'urg-opt';
  document.getElementById('ed-steven').classList.add('on');
  document.getElementById('ed-sherlynn').classList.remove('on');
  document.getElementById('btn-save').disabled = false;
  document.getElementById('add-modal').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 300);
}
function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }

function pickU(u) {
  urgency = urgency === u ? null : u;
  document.getElementById('opt-u').className = 'urg-opt' + (urgency === 'urgent'    ? ' sel-u' : '');
  document.getElementById('opt-e').className = 'urg-opt' + (urgency === 'evergreen' ? ' sel-e' : '');
}

async function saveVideo() {
  const title  = document.getElementById('f-title').value.trim();
  const script = document.getElementById('f-script').value.trim();
  const date   = document.getElementById('f-date').value;
  if (!title)   { showToast('Please enter a title'); return; }
  if (!date)    { showToast('Please pick a date'); return; }
  if (!urgency) { showToast('Please choose Urgent or Evergreen'); return; }

  document.getElementById('btn-save').disabled = true;

  const video = { title, script, date, status: 'pending', urgency, editor };
  const res   = await apiPost({ action: 'add', video });
  const id    = res?.id ? String(res.id) : String(Date.now());
  videos.push({ ...video, id });

  document.getElementById('btn-save').disabled = false;
  closeAdd(); renderAll(); saveLocal();
  showToast('Reel added');
}

// ─── DETAIL ───────────────────────────────────────────────────────────────
function openDet(id, editMode) {
  curId = id;
  const v = videos.find(x => x.id === id);
  if (!v) return;

  const bc = v.status === 'pending' ? 'b-pend' : v.status === 'editing' ? 'b-edit' : 'b-done';
  const bl = v.status === 'pending' ? 'Pending' : v.status === 'editing' ? 'Editing' : 'Done';

  document.getElementById('det-modal-title').textContent = fmtDate(v.date);

  if (editMode) {
    // ── EDIT MODE ──
    document.getElementById('det-title').innerHTML =
      `<input class="edit-field" id="edit-title" value="${escH(v.title)}" placeholder="Title" />`;
    document.getElementById('det-meta').innerHTML =
      `<button class="btn-save-edit" onclick="saveEdit('${id}')">Save changes</button>
       <button class="btn-cancel-edit" onclick="openDet('${id}', false)">Cancel</button>`;

    const sc = document.getElementById('det-script');
    sc.innerHTML = `<textarea class="edit-textarea" id="edit-script" placeholder="Script…">${escH(v.script || '')}</textarea>`;
    sc.style = '';

    // Date edit
    document.getElementById('det-status').innerHTML =
      `<div style="margin-bottom:8px">
        <div class="det-section" style="margin-bottom:6px">Date</div>
        <input class="edit-field" id="edit-date" type="date" value="${v.date || ''}" style="max-width:200px" />
      </div>
      <div>${[['pending','Pending','sp'],['editing','Editing','se'],['done','Done ✓','sd']].map(([s,l,c]) =>
        `<button class="s-btn${v.status === s ? ' ' + c : ''}" onclick="setStatus('${id}','${s}')">${l}</button>`
      ).join('')}</div>`;

    // Editor in edit mode
    document.getElementById('det-urg').innerHTML =
      `<div style="width:100%;margin-bottom:12px">
        <div class="det-section" style="margin-bottom:6px">Editor</div>
        <div class="editor-toggle" style="max-width:220px">
          <button class="editor-opt${(v.editor||'Steven')==='Steven'?' on':''}" id="det-ed-s" onclick="setDetEditor('${id}','Steven')">Steven</button>
          <button class="editor-opt${v.editor==='Sherlynn'?' on':''}" id="det-ed-sh" onclick="setDetEditor('${id}','Sherlynn')">Sherlynn</button>
        </div>
      </div>
      <div><div class="det-section" style="margin-bottom:6px">Content type</div>
      ${[['urgent','🔥 Urgent','su'],['evergreen','🌿 Evergreen','se2']].map(([u,l,c]) =>
        `<button class="u-btn${v.urgency === u ? ' ' + c : ''}" onclick="setUrgency('${id}','${u}')">${l}</button>`
      ).join('')}</div>`;

  } else {
    // ── VIEW MODE ──
    document.getElementById('det-title').innerHTML =
      `<span>${escH(v.title)}</span> <button class="edit-btn" onclick="openDet('${id}', true)" style="margin-left:8px;font-size:13px">Edit</button>`;
    document.getElementById('det-meta').innerHTML =
      `<span class="badge ${bc}">${bl}</span>` +
      (v.urgency ? `<span class="badge ${v.urgency === 'urgent' ? 'b-urg' : 'b-eve'}">${v.urgency === 'urgent' ? '🔥 Urgent' : '🌿 Evergreen'}</span>` : '') +
      `<span class="det-date" style="color:var(--ink3);font-size:13px">${fmtDate(v.date)}</span>` +
      `<span style="font-size:12px;color:var(--ink3)">✂️ ${v.editor || 'Steven'}</span>`;

    const sc = document.getElementById('det-script');
    sc.textContent    = v.script || 'No script added.';
    sc.style.fontStyle = v.script ? 'normal' : 'italic';
    sc.style.color     = v.script ? 'var(--ink2)' : 'var(--ink3)';

    document.getElementById('det-status').innerHTML =
      [['pending','Pending','sp'],['editing','Editing','se'],['done','Done ✓','sd']].map(([s,l,c]) =>
        `<button class="s-btn${v.status === s ? ' ' + c : ''}" onclick="setStatus('${id}','${s}')">${l}</button>`
      ).join('');

    document.getElementById('det-urg').innerHTML =
      `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${[['urgent','🔥 Urgent','su'],['evergreen','🌿 Evergreen','se2']].map(([u,l,c]) =>
          `<button class="u-btn${v.urgency === u ? ' ' + c : ''}" onclick="setUrgency('${id}','${u}')">${l}</button>`
        ).join('')}
        <span style="font-size:12px;color:var(--ink3);margin-left:4px">Editor: ${v.editor || 'Steven'}</span>
      </div>`;
  }

  document.getElementById('det-modal').classList.add('open');
}
function closeDet() { document.getElementById('det-modal').classList.remove('open'); }

async function saveEdit(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  const newTitle  = document.getElementById('edit-title')?.value.trim();
  const newScript = document.getElementById('edit-script')?.value.trim();
  const newDate   = document.getElementById('edit-date')?.value;
  if (!newTitle) { showToast('Title cannot be empty'); return; }
  v.title  = newTitle  || v.title;
  v.script = newScript !== undefined ? newScript : v.script;
  v.date   = newDate   || v.date;
  await apiPost({ action: 'update', id, fields: { title: v.title, script: v.script, date: v.date } });
  renderAll(); saveLocal();
  openDet(id, false);
  showToast('Changes saved');
}

function setDetEditor(id, e) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  v.editor = e;
  document.getElementById('det-ed-s')?.classList.toggle('on',  e === 'Steven');
  document.getElementById('det-ed-sh')?.classList.toggle('on', e === 'Sherlynn');
  apiPost({ action: 'update', id, fields: { editor: e } });
  saveLocal();
}

async function setStatus(id, status) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  v.status = status;
  await apiPost({ action: 'update', id, fields: { status } });
  openDet(id); renderAll(); saveLocal();
  showToast('Status updated');
}

async function setUrgency(id, u) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  v.urgency = v.urgency === u ? null : u;
  await apiPost({ action: 'update', id, fields: { urgency: v.urgency } });
  openDet(id); renderAll(); saveLocal();
  showToast('Type updated');
}

async function deleteVideo() {
  if (!confirm('Remove this reel?')) return;
  await apiPost({ action: 'delete', id: curId });
  videos = videos.filter(v => v.id !== curId);
  closeDet(); renderAll(); saveLocal();
  showToast('Removed');
}

// ─── ARCHIVE DONE VIDEOS ─────────────────────────────────────────────────
async function doArchiveWeek() {
  const done = videos.filter(v => v.status === 'done');
  if (!done.length) { showToast('No done reels to archive'); return; }
  if (!confirm(`Archive ${done.length} done reel${done.length > 1 ? 's' : ''}?`)) return;
  const today = new Date().toISOString().split('T')[0];
  for (const v of done) {
    await apiPost({ action: 'archive', id: v.id });
    archived.push({ ...v, archivedOn: today });
  }
  videos = videos.filter(v => v.status !== 'done');
  renderAll(); saveLocal();
  showToast(`${done.length} reel${done.length > 1 ? 's' : ''} archived`);
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────
function renderAll() { renderBoard(); updateStats(); }

function updateStats() {
  document.getElementById('stn').textContent = videos.length;
  document.getElementById('stp').textContent = videos.filter(v => v.status === 'pending').length;
  document.getElementById('std').textContent = videos.filter(v => v.status === 'done').length;
  // Update section title
  const t = document.getElementById('section-title-lbl');
  if (t) t.textContent = activeFilter === 'all' ? 'Active' : activeFilter.charAt(0).toUpperCase() + activeFilter.slice(1);
}

function renderBoard() {
  const el = document.getElementById('vid-list');
  const filtered = activeFilter === 'all'
    ? videos
    : videos.filter(v => v.status === activeFilter);

  if (!filtered.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">${activeFilter === 'all' ? '🎬' : activeFilter === 'pending' ? '⏳' : '✅'}</div>
      <div class="empty-title">${activeFilter === 'all' ? 'No reels yet' : 'No ' + activeFilter + ' reels'}</div>
      <div class="empty-sub">${activeFilter === 'all' ? 'Tap New to add Desmond\'s first reel' : 'Tap All to see everything'}</div>
    </div>`;
    return;
  }

  // Sort: pending → editing → done, then newest first within each group
  const order = ['pending','editing','done'];
  const sorted = [...filtered].sort((a,b) => {
    const si = order.indexOf(a.status) - order.indexOf(b.status);
    if (si !== 0) return si;
    return new Date(b.date) - new Date(a.date);
  });

  el.innerHTML = `<div class="vid-list">${sorted.map(v => {
    const bc = v.status === 'pending' ? 'b-pend' : v.status === 'editing' ? 'b-edit' : 'b-done';
    const bl = v.status === 'pending' ? 'Pending' : v.status === 'editing' ? 'Editing' : 'Done';
    const ub = v.urgency === 'urgent'
      ? '<span class="badge b-urg">🔥</span>'
      : v.urgency === 'evergreen'
      ? '<span class="badge b-eve">🌿</span>'
      : '';
    const edTag = `<span style="font-size:11px;color:var(--ink3)">✂️ ${v.editor || 'Steven'}</span>`;
    return `<div class="vid-item" onclick="openDet('${v.id}', false)">
      <div class="vid-left">
        <div class="vid-title">${escH(v.title)}</div>
        <div class="vid-meta">
          <span class="vid-date">${fmtDate(v.date)}</span>
          ${ub}
          ${edTag}
        </div>
      </div>
      <div class="vid-right">
        <span class="badge ${bc}">${bl}</span>
      </div>
      <div class="chevron"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`;
  }).join('')}</div>`;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────
function renderWeek() {
  const now  = new Date();
  const base = new Date(now);
  base.setDate(now.getDate() - ((now.getDay() + 6) % 7) + weekOff * 7);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(base); d.setDate(base.getDate() + i); return d;
  });
  const DAY = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today = now.toISOString().split('T')[0];

  document.getElementById('wlbl').textContent =
    days[0].toLocaleDateString('en-MY', { day: 'numeric', month: 'short' }) + ' – ' +
    days[6].toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });

  document.getElementById('cal-days').innerHTML = days.map((d, i) => {
    const iso   = d.toISOString().split('T')[0];
    const isT   = iso === today;
    const dvids = videos.filter(v => v.date === iso);
    return `<div class="cal-day">
      <div class="cal-day-hdr${isT ? ' today' : ''}">
        <span class="cal-day-name">${DAY[i]}${isT ? ' · Today' : ''}</span>
        <span class="cal-day-num">${d.getDate()}</span>
      </div>
      ${dvids.length
        ? dvids.map(v => {
            const bc = v.status === 'pending' ? 'b-pend' : v.status === 'editing' ? 'b-edit' : 'b-done';
            const bl = v.status === 'pending' ? 'Pending' : v.status === 'editing' ? 'Editing' : 'Done';
            return `<div class="cal-item" onclick="openDet('${v.id}')">
              <div class="cal-dot" style="background:${v.urgency === 'urgent' ? 'var(--red)' : 'var(--green)'}"></div>
              <span class="cal-title">${escH(v.title)}</span>
              <span class="badge ${bc}">${bl}</span>
            </div>`;
          }).join('')
        : '<div class="cal-empty">No reels</div>'
      }
    </div>`;
  }).join('');
}
function prevWeek() { weekOff--; renderWeek(); }
function nextWeek() { weekOff++; renderWeek(); }

// ─── ARCHIVE ──────────────────────────────────────────────────────────────
function renderArchive() {
  const el = document.getElementById('arch-content');
  if (!archived.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">🗂️</div>
      <div class="empty-title">Nothing archived yet</div>
      <div class="empty-sub">Done reels are archived weekly from the Board tab</div>
    </div>`;
    return;
  }
  const byWeek = {};
  archived.forEach(v => {
    const k = v.archivedOn || v.date || '';
    if (!byWeek[k]) byWeek[k] = [];
    byWeek[k].push(v);
  });
  el.innerHTML = Object.keys(byWeek).sort().reverse().map(k => {
    const label = 'Archived ' + fmtDate(k);
    return `<div class="arch-month-lbl">${label}</div>
    <div class="vid-list">${byWeek[k].map(v => {
      const bc = v.status === 'done' ? 'b-done' : 'b-pend';
      return `<div class="vid-item">
        <div class="vid-left">
          <div class="vid-title">${escH(v.title)}</div>
          <div class="vid-meta"><span class="vid-date">${fmtDate(v.date)}</span></div>
        </div>
        <span class="badge b-done">Done</span>
      </div>`;
    }).join('')}</div>`;
  }).join('');
}

// ─── SHEETS ───────────────────────────────────────────────────────────────
function renderExport() {
  const all = [...videos, ...archived];
  document.getElementById('etbody').innerHTML = all.length
    ? all.sort((a,b) => new Date(b.date) - new Date(a.date)).map(v => `<tr>
        <td>${fmtDate(v.date)}</td>
        <td title="${escH(v.title)}">${escH(v.title)}</td>
        <td>${v.urgency === 'urgent' ? '🔥 Urgent' : v.urgency === 'evergreen' ? '🌿 Evergreen' : '—'}</td>
        <td><span class="badge ${v.status === 'pending' ? 'b-pend' : v.status === 'editing' ? 'b-edit' : 'b-done'}">${v.status}</span></td>
      </tr>`).join('')
    : '<tr><td colspan="4" style="padding:16px;text-align:center;color:var(--ink3)">No reels yet</td></tr>';
}

function renderSetup() {
  const el = document.getElementById('setup-zone');
  if (SCRIPT_URL) {
    el.innerHTML = `<div class="connected-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>
      Live sync connected
      <button onclick="clearURL()" style="background:none;border:none;color:var(--done-tx);cursor:pointer;font-size:12px;margin-left:auto;text-decoration:underline;font-family:inherit;font-weight:600">Change</button>
    </div>`;
  } else {
    el.innerHTML = `<div class="setup-card">
      <div class="setup-title">Connect Google Sheet</div>
      <div class="setup-body">
        Paste your Apps Script Web App URL below to enable live sync across all devices.<br>
        <a href="#" onclick="toggleSteps(event)" style="color:var(--blue)">Show setup steps ›</a>
      </div>
      <div class="setup-steps" id="setup-steps">
        <b>One-time 5-minute setup:</b><br>
        1. Go to <a href="https://script.google.com" target="_blank" style="color:var(--blue)">script.google.com</a> → New project<br>
        2. Delete all code → paste the <code>Code.gs</code> contents<br>
        3. Deploy → New deployment → <b>Web app</b><br>
        4. Execute as: <b>Me</b> · Access: <b>Anyone</b><br>
        5. Copy the Web App URL → paste below
      </div>
      <input class="setup-input" id="url-input" placeholder="https://script.google.com/macros/s/…/exec" />
      <button class="action-btn" style="width:100%;justify-content:center;display:flex" onclick="saveURL()">Save &amp; Connect</button>
    </div>`;
  }
}
function toggleSteps(e) {
  e.preventDefault();
  const el = document.getElementById('setup-steps');
  if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function saveURL() {
  const u = document.getElementById('url-input')?.value.trim();
  if (!u || !u.includes('script.google.com')) { showToast('Paste a valid Apps Script URL'); return; }
  SCRIPT_URL = u; localStorage.setItem('reels_url', u);
  renderSetup(); showToast('Connected — syncing…'); doRefresh();
}
function clearURL() { SCRIPT_URL = ''; localStorage.removeItem('reels_url'); renderSetup(); }

// ─── CSV ──────────────────────────────────────────────────────────────────
function getCSV() {
  const all = [...videos, ...archived];
  return 'Date,Title,Type,Status,Script\n' + all.map(v =>
    [v.date,
     '"' + (v.title  || '').replace(/"/g, '""') + '"',
     v.urgency || '',
     v.status,
     '"' + (v.script || '').replace(/"/g, '""').replace(/\n/g, ' ') + '"'
    ].join(',')
  ).join('\n');
}
function cpCSV() {
  navigator.clipboard.writeText(getCSV())
    .then(() => showToast('CSV copied'))
    .catch(() => showToast('Use Download instead'));
}
function dlCSV() {
  const b = new Blob([getCSV()], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'desmond-reels.csv'; a.click();
  showToast('CSV downloaded');
}

// ─── HELPERS ──────────────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '—';
  // Handle both YYYY-MM-DD and other formats
  const dt = new Date(d.includes('T') ? d : d + 'T00:00:00');
  if (isNaN(dt.getTime())) return d; // return raw if still invalid
  return dt.toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
}
function escH(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

// ─── INIT ─────────────────────────────────────────────────────────────────
renderAll();
if (SCRIPT_URL) doRefresh();
</script>
</body>
</html>
